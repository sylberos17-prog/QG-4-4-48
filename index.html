<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QG 4/4/48</title>
<meta name="description" content="Pilotage de La Saintes 4/4/48, endurance SUP sur la Charente">
<meta name="theme-color" content="#0d1526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QG 4/4/48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e2e7f0; --ink:#0d1526; --muted:#56617a; --line:#cdd5e3;
  --gold:#8a6a1f; --gold-soft:#f1e6c8; --on-gold:#ffffff; --violet:#5a3ea6; --violet-soft:#e8e2f7;
  --ok:#1d7552; --warn:#9a520f; --danger:#b3261e; --river:#2a6a89;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --scale:1; --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1526; --surface:#142039; --surface2:#1b2a49; --ink:#eef1f6; --muted:#9ba7c2; --line:#2a3b60;
    --gold:#c8a24a; --gold-soft:#2c2a2a; --on-gold:#0d1526; --violet:#a98ff2; --violet-soft:#241f45;
    --ok:#52c393; --warn:#eda24f; --danger:#f06c64; --river:#6fb6d6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1526; --surface:#142039; --surface2:#1b2a49; --ink:#eef1f6; --muted:#9ba7c2; --line:#2a3b60;
  --gold:#c8a24a; --gold-soft:#2c2a2a; --on-gold:#0d1526; --violet:#a98ff2; --violet-soft:#241f45;
  --ok:#52c393; --warn:#eda24f; --danger:#f06c64; --river:#6fb6d6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:calc(16px * var(--scale));scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--river)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100%}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1.1}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--warn)}

main{overflow:auto;padding:1rem 1rem calc(96px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:1080px;margin:0 auto}
.side{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .55rem;color:var(--muted);text-decoration:none;font-size:.72rem;min-height:56px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--gold)}
.fab{position:fixed;right:1rem;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--on-gold);box-shadow:0 6px 18px rgba(13,21,38,.35);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}

@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .top{grid-column:1/-1}
  .side{display:block;overflow:auto;border-right:1px solid var(--line);padding:1rem .6rem}
  .side a{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
  .side a svg{width:18px;height:18px;color:var(--muted)}
  .side a[aria-current="page"]{background:var(--surface2)}
  .side a[aria-current="page"] svg{color:var(--gold)}
  .side h3{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.95rem;margin:1rem .7rem .3rem}
  .tabs{display:none}
  main{padding:1.5rem 2rem 6rem}
  .fab{bottom:2rem;right:2rem}
}

h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0}
h1{font-size:2rem;letter-spacing:.005em}
h2{font-size:1.4rem;margin:1.6rem 0 .6rem}
.lede{color:var(--muted);margin:.3rem 0 1rem;max-width:62ch}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ai{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{min-height:36px;padding:.3rem .8rem;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:default}

/* Dashboard */
.hero{display:grid;gap:1.2rem;align-items:center}
@media (min-width:700px){.hero{grid-template-columns:minmax(260px,340px) 1fr}}
.ring{width:100%;max-width:340px;margin:0 auto;display:block}
.ring .seg{cursor:pointer}
.ring .seg:focus-visible{outline:none}
.ring .seg:focus-visible path{stroke:var(--gold);stroke-width:3}
.ring text{font-family:var(--display)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem}
.kpi strong{display:block;font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1}
.kpi span{color:var(--muted);font-size:.88rem}
.kpi.alert strong{color:var(--danger)}

.alerts{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.alerts li{border-top:1px solid var(--line)}
.alerts li:first-child{border-top:0}
.alerts a{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .9rem;color:var(--ink);text-decoration:none}
.lvl{flex:none;width:.6rem;height:.6rem;border-radius:2px;margin-top:.45rem;background:var(--muted)}
.lvl.danger{background:var(--danger)} .lvl.warn{background:var(--warn)} .lvl.info{background:var(--river)}

/* Lists */
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 .8rem}
.search{flex:1;min-width:180px;min-height:44px;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{min-height:36px;padding:.25rem .8rem;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.item{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.75rem .9rem;cursor:pointer;color:var(--ink)}
.item:hover{background:var(--surface2)}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:.86rem}
.pill{flex:none;font-size:.78rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;border:1px solid currentColor;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.gold{color:var(--gold)} .pill.danger{color:var(--danger)} .pill.warn{color:var(--warn)} .pill.violet{color:var(--violet)}
.empty{padding:1.4rem;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:.2rem 0 .8rem}
.sum{display:flex;gap:1.4rem;flex-wrap:wrap;margin:.4rem 0 .4rem}
.sum div{min-width:90px}
.sum strong{display:block;font-family:var(--display);font-size:1.6rem;line-height:1}
.sum span{color:var(--muted);font-size:.85rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:.3rem}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.over i{background:var(--danger)}

.kanban{display:grid;gap:.8rem;grid-template-columns:1fr}
@media (min-width:760px){.kanban{grid-template-columns:repeat(3,1fr)}}
.col h3{font-size:1.1rem;margin:0 0 .4rem;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;margin-bottom:.5rem}
.card .t{font-weight:600;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.card .m{color:var(--muted);font-size:.85rem;margin:.2rem 0 .5rem}

/* Manches */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{display:grid;grid-template-columns:4.2rem 1fr;gap:.8rem;margin-bottom:.5rem}
.timeline .when{font-family:var(--display);font-weight:600;text-align:right;padding-top:.7rem;line-height:1.1}
.timeline .when small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.75rem}
.timeline .card{margin:0;display:flex;gap:.8rem;align-items:center;cursor:pointer;text-align:left;width:100%}
.timeline .num{font-family:var(--display);font-weight:700;font-size:1.6rem;width:2.4rem;text-align:center}
.timeline .now .card{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:.65rem;cursor:pointer;padding:0;color:var(--muted)}
.dot.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* checklists */
.check{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .9rem}
.check input{width:24px;height:24px;margin:.1rem 0 0;accent-color:var(--gold);flex:none}
.check .m{color:var(--muted);font-size:.82rem}
.check.done .t{text-decoration:line-through;color:var(--muted)}

/* Drive */
.crumbs{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;font-size:.9rem;margin:.4rem 0 .8rem}
.crumbs button{background:none;border:0;color:var(--river);cursor:pointer;padding:.2rem .1rem;text-decoration:underline}
.crumbs span{color:var(--muted)}
.fiche{display:grid;gap:.6rem;grid-template-columns:1fr}
@media (min-width:760px){.fiche{grid-template-columns:1fr 1fr}}
.fiche dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem}
.fiche dt{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.95rem}
.fiche dd{margin:.1rem 0 .6rem;white-space:pre-wrap}
.fiche dd.missing{color:var(--warn)}
.ftype{flex:none;width:2.6rem;font-size:.7rem;font-weight:700;text-align:center;padding:.3rem 0;border-radius:6px;background:var(--surface2);color:var(--muted)}
.ftype.folder{background:var(--gold-soft);color:var(--gold)}

/* Assistant */
.chat{display:flex;flex-direction:column;gap:.7rem;margin:.6rem 0 1rem}
.msg{max-width:46rem;padding:.7rem .9rem;border-radius:12px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--surface2)}
.msg.a{align-self:flex-start;background:var(--violet-soft);border:1px solid var(--line)}
.ask{display:flex;gap:.5rem;position:sticky;bottom:0;background:var(--bg);padding:.5rem 0}
.ask textarea{flex:1;min-height:48px;max-height:160px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:.6rem .8rem;resize:vertical}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;border-radius:16px 16px 0 0;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-width:700px){dialog{border-radius:16px;margin:auto}}
dialog::backdrop{background:rgba(5,10,20,.55)}
.sheet{display:flex;flex-direction:column;max-height:92vh}
.sheet header{display:flex;align-items:center;gap:.5rem;padding:1rem 1rem .4rem}
.sheet header h2{margin:0;flex:1}
.sheet .body{overflow:auto;padding:.3rem 1rem 1rem;display:grid;gap:.8rem}
.sheet footer{display:flex;gap:.5rem;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
label.f{display:grid;gap:.25rem;font-weight:600;font-size:.92rem}
label.f input,label.f select,label.f textarea{font-weight:400;min-height:44px;padding:.5rem .7rem;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
label.f textarea{min-height:90px;resize:vertical}
label.cb{display:flex;gap:.6rem;align-items:center;font-weight:600}
label.cb input{width:22px;height:22px;accent-color:var(--gold)}
.grid2{display:grid;gap:.8rem;grid-template-columns:1fr 1fr}
.quick{display:grid;gap:.5rem;grid-template-columns:1fr 1fr}
.quick .btn{border-radius:12px;min-height:64px}
.morelist{display:grid;gap:.5rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.morelist{grid-template-columns:repeat(3,1fr)}}
.morelist a{display:flex;align-items:center;gap:.6rem;padding:.9rem;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.morelist a svg{width:20px;height:20px;color:var(--gold)}
.note{font-size:.88rem;color:var(--muted)}
.banner{padding:.7rem .9rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin:.6rem 0}
.banner.warn{border-color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.t{width:100%;border-collapse:collapse;background:var(--surface)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.t th,table.t td{padding:.5rem .7rem;border-top:1px solid var(--line);text-align:left;font-size:.92rem}
table.t th{font-family:var(--display);font-weight:600;color:var(--muted);border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/accueil" aria-label="QG 4/4/48, accueil">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--gold)" stroke-width="2.5"/><circle cx="20" cy="20" r="14" fill="none" stroke="var(--gold)" stroke-width="1"/><path d="M9 25c3-2 5-2 7.5 0s5 2 7.5 0 5-2 7 0M10 29c3-2 5-2 7.5 0s5 2 7.5 0 4.5-2 6.5 0" fill="none" stroke="var(--river)" stroke-width="1.6" stroke-linecap="round"/><circle cx="20" cy="11.5" r="2" fill="var(--ink)"/><path d="M20 13.5v7l-3 3.5M20 17l4-2M24 10l-1 12" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span><b>QG 4/4/48</b><small>La Saintes, 3 au 5 juin 2028</small></span>
    </a>
    <span class="sync" id="sync" role="status"><i></i><span>Chargement</span></span>
    <button class="iconbtn" data-go="recherche" aria-label="Rechercher partout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </header>
  <nav class="side" id="side" aria-label="Modules"></nav>
  <main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
</div>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<button class="fab" id="fab" aria-label="Action rapide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="sheet"><div class="sheet" id="sheetin"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return"";const x=new Date(d.length===10?d+"T12:00":d);return isNaN(x)?d:x.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})};
const fmtTime=d=>new Date(d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const fmtDay=d=>new Date(d).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"});
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const daysTo=d=>Math.ceil((new Date(d.length===10?d+"T23:59":d)-Date.now())/864e5);
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;const j=Math.round(h/24);return`il y a ${j} j`};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}
const LS={get(k,d){try{const v=localStorage.getItem("qg448-"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("qg448-"+k,JSON.stringify(v))}catch(e){}}};

const I={
 home:'<path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/>',
 task:'<path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/>',
 ring:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
 ai:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 stamp:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5"/>',
 handshake:'<path d="M3 12l4-4 4 3 3-3 7 5-5 5-3-2-3 3z"/>',
 euro:'<path d="M17 6a7 7 0 1 0 0 12M4 10h9M4 14h9"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.5c3 0 5.5 1.6 5.5 4.5"/>',

function clean(o){const r={};for(const[k,v]of Object.entries(o)){if(v===undefined)continue;r[k]=v}return r}
async function save(col,id,obj,{silent}={}){
  const prev=id?S.data[col].find(x=>x.id===id):null;
  const body=clean({...(prev||{}),...obj});delete body.id;body.maj=new Date().toISOString();
  if(S.mode==="db"){
    try{const ref=id?S.db.collection(col).doc(id):S.db.collection(col).doc();await ref.set(body);id=ref.id||id}
    catch(e){handleDbErr(e);return null}
  }else{
    id=id||("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const i=S.data[col].findIndex(x=>x.id===id);const rec={id,...body};if(i>=0)S.data[col][i]=rec;else S.data[col].push(rec);
    LS.set("local",{data:S.data,cfg:S.cfg});render();
  }
  if(!silent)logJournal(prev?"a modifié":"a ajouté",col,body[SCHEMA[col].titre]||body.titre||"");
  return id;
}
async function remove(col,id){
  const prev=S.data[col].find(x=>x.id===id);
  if(S.mode==="db"){try{await S.db.collection(col).doc(id).delete()}catch(e){handleDbErr(e);return}}
  else{S.data[col]=S.data[col].filter(x=>x.id!==id);LS.set("local",{data:S.data,cfg:S.cfg});render()}
  logJournal("a supprimé",col,prev?(prev[SCHEMA[col].titre]||""):"");
}

function logJournal(act,col,titre){

  if(S.mode==="db"){S.db.collection("journal").add(e).catch(()=>{})}

}
function handleDbErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")toast("Base pleine : supprime des éléments anciens.");
  else if(c==="revoked"||c==="not_granted")toast("Lecture seule : tu n'as pas les droits d'écriture.");
  else if(c==="resource_exhausted")toast("Trop de modifications d'un coup, réessaie dans un instant.");
  else toast("Enregistrement impossible pour le moment.");
}

let renderQueued=false;
function render(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;draw()})}
async function connect(){
  const c=window.claude;
  if(!c||!c.use){startLocal();return}
  const [db,user,sample,mcp,dl]=await Promise.all(["db","user","sample","mcp","downloads"].map(n=>c.use(n).catch(()=>null)));
  S.sample=sample;S.mcp=mcp;S.dl=dl;S.user=user;
  if(user){try{S.uid=await user.id()}catch(e){}}
  if(!db){startLocal();return}
  S.db=db;S.mode="db";setSync("on","Synchronisé");
  const loaded=new Set();
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{S.data[col]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(col);cacheAll();render()},
      e=>{if(e&&e.code==="revoked"){setSync("off","Accès retiré")}else setSync("off","Hors ligne, données en cache")});
  });
  ["event","drive"].forEach(n=>db.doc("config/"+n).onSnapshot(d=>{S.cfg[n]=d.exists?{...d.data()}:{};cacheAll();render()},()=>{}));
  db.collection("journal").orderBy("quand","desc").limit(120).onSnapshot(s=>{S.journal=s.docs.map(d=>({id:d.id,...d.data()}));cacheAll();resolveNames();render()},()=>{});
  render();
}

function setupAI(){
  const key=LS.get("apikey","");if(!key){if(S.aiShim)S.sample=null;return}
  const call=async(input,opts={})=>{
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:LS.get("apimodel",DEFAULT_MODEL)||DEFAULT_MODEL,max_tokens:2000,messages})})}
    catch(e){throw{code:"network",message:"Pas de réseau"}}
    if(!res.ok){const code=res.status===401?"bad_key":res.status===429?"rate_limited":"api_error";let m="";try{m=(await res.json()).error.message}catch(_){}throw{code,message:m}}
    const j=await res.json();const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(opts.onText)opts.onText({text,delta:text});return{text,truncated:j.stop_reason==="max_tokens"};
  };
  call.json=async(input,opts)=>{const r=await call(input,opts);const t=r.text.replace(/```json|```/g,"").trim();const i=t.indexOf("{"),k=t.lastIndexOf("}");return JSON.parse(t.slice(i,k+1))};
  S.sample=call;S.aiShim=true;
}

function manches(){
  const t0=new Date(startISO()).getTime();
  return Array.from({length:12},(_,i)=>{
    const id="m"+String(i+1).padStart(2,"0");const o=S.data.manches.find(m=>m.id===id)||{};
    const deb=t0+i*MS4;let st=o.statut||"planifie";
    return{id,n:i+1,deb,fin:deb+MS4,...o,statut:st,titre:"Manche "+(i+1)};
  });
}
function phase(){const t0=new Date(startISO()).getTime(),now=Date.now();if(now<t0)return{avant:true,j:Math.ceil((t0-now)/864e5)};if(now<t0+48*3600e3)return{pendant:true,n:Math.floor((now-t0)/MS4)+1,reste:MS4-((now-t0)%MS4)};return{apres:true}}
function alerts(){
  const a=[],d=S.data;const add=(lvl,txt,route)=>a.push({lvl,txt,route});
  const open=d.demarches.filter(x=>x.statut!=="valide");
  open.forEach(x=>{if(x.statut==="expire")add("danger",`${x.titre} : expirée, à renouveler`,"demarches");else if(x.echeance){const j=daysTo(x.echeance);if(j<0)add("danger",`${x.titre} : échéance dépassée de ${-j} j`,"demarches");else if(j<=30)add("warn",`${x.titre} : échéance dans ${j} j`,"demarches")}});
  const sansEch=open.filter(x=>!x.echeance&&x.statut!=="expire").length;
  if(sansEch)add("info",`${sansEch} démarche${sansEch>1?"s":""} sans échéance`,"demarches");
  const tOpen=d.taches.filter(x=>x.statut!=="fait");
  const late=tOpen.filter(x=>x.echeance&&daysTo(x.echeance)<0);
  if(late.length)add("danger",`${late.length} tâche${late.length>1?"s":""} en retard`,"taches");
  const soon=tOpen.filter(x=>x.echeance&&daysTo(x.echeance)>=0&&daysTo(x.echeance)<=7);
  if(soon.length)add("warn",`${soon.length} tâche${soon.length>1?"s":""} à boucler cette semaine`,"taches");
  const noResp=tOpen.filter(x=>!x.responsable).length;if(noResp)add("info",`${noResp} tâche${noResp>1?"s":""} sans responsable`,"taches");
  d.sponsors.filter(x=>x.relance&&daysTo(x.relance)<=0&&!["confirme","remercie","refus"].includes(x.statut)).forEach(x=>add("warn",`Relancer ${x.nom}`,"sponsors"));
  d.budget.filter(x=>x.sens==="depense"&&+x.reel>+x.prevu&&+x.prevu>0).forEach(x=>add("warn",`${x.libelle} : dépassement de ${eur(x.reel-x.prevu)}`,"budget"));
  d.risques.filter(x=>x.statut==="ouvert"&&score(x)>=9&&!x.plan).forEach(x=>add("danger",`Risque fort sans plan d'action : ${x.titre}`,"risques"));
  d.incidents.filter(x=>!x.resolu&&x.gravite==="grave").forEach(x=>add("danger",`Incident grave non résolu`,"risques"));
  if(!S.cfg.event.heureConfirmee)add("info","Heure de départ de la manche 1 à confirmer","reglages");
  const polesPrevus=+S.cfg.event.polesPrevus||11;if(d.poles.length<polesPrevus)add("info",`${polesPrevus-d.poles.length} pôle${polesPrevus-d.poles.length>1?"s":""} bénévoles à créer sur ${polesPrevus}`,"equipe");
  d.poles.filter(p=>!p.responsable).forEach(p=>add("info",`Pôle ${p.nom} sans responsable`,"equipe"));
  d.pagayeurs.filter(p=>!p.urgence).length&&add("warn",`${d.pagayeurs.filter(p=>!p.urgence).length} pagayeur(s) sans contact d'urgence`,"pagayeurs");
  const ph=phase();if(ph.avant&&ph.j<=2){const n=d.checklist.filter(c=>c.phase==="avant"&&!c.fait).length;if(n)add("danger",`${n} point(s) de la check-list d'avant départ non validés`,"jourj")}
  const rank={danger:0,warn:1,info:2};return a.sort((x,y)=>rank[x.lvl]-rank[y.lvl]);
}

/* ---------- l'anneau des 48 h ---------- */
function ringSVG(){
  const M=manches(),ph=phase(),cx=160,cy=160,R=128,w=26,gap=2.2;
  const pt=(a,r)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];
  const color=m=>{if(ph.pendant&&m.n===ph.n&&m.statut==="planifie")return"var(--gold)";return{en_cours:"var(--gold)",termine:"var(--ok)",annule:"var(--danger)"}[m.statut]||"var(--surface2)"};
  const segs=M.map((m,i)=>{
    const a0=(i*30+gap)*Math.PI/180,a1=((i+1)*30-gap)*Math.PI/180,ro=R+w/2,ri=R-w/2;
    const [x1,y1]=pt(a0,ro),[x2,y2]=pt(a1,ro),[x3,y3]=pt(a1,ri),[x4,y4]=pt(a0,ri);
    const [lx,ly]=pt((i*30+15)*Math.PI/180,R);
    const dark=["termine","annule","en_cours"].includes(m.statut)||(ph.pendant&&m.n===ph.n);
    return`<g class="seg" tabindex="0" role="button" data-edit="manches" data-id="${m.id}" aria-label="Manche ${m.n}, ${fmtDay(m.deb)} à ${fmtTime(m.deb)}, ${lab("manche",m.statut)}"><path d="M${x1} ${y1}A${ro} ${ro} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${ri} ${ri} 0 0 0 ${x4} ${y4}Z" fill="${color(m)}" stroke="var(--line)" stroke-width="1"/><text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${dark?"var(--bg)":"var(--muted)"}">${m.n}</text></g>`;
  }).join("");
  let center;
  if(ph.avant)center=`<text x="160" y="150" text-anchor="middle" font-size="64" font-weight="700" fill="var(--ink)">J−${ph.j}</text><text x="160" y="180" text-anchor="middle" font-size="15" fill="var(--muted)" font-family="Barlow,sans-serif">avant la manche 1</text><text x="160" y="202" text-anchor="middle" font-size="15" fill="var(--gold)" font-family="Barlow,sans-serif">${esc(new Date(startISO()).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))}, ${fmtTime(startISO())}</text>`;
  else if(ph.pendant){const h=Math.floor(ph.reste/36e5),mn=Math.floor(ph.reste%36e5/6e4);center=`<text x="160" y="140" text-anchor="middle" font-size="22" fill="var(--muted)">Manche en cours</text><text x="160" y="196" text-anchor="middle" font-size="76" font-weight="700" fill="var(--gold)">${ph.n}</text><text x="160" y="222" text-anchor="middle" font-size="15" fill="var(--muted)" font-family="Barlow,sans-serif">prochain départ dans ${h} h ${String(mn).padStart(2,"0")}</text>`}
  else center=`<text x="160" y="170" text-anchor="middle" font-size="40" font-weight="700" fill="var(--ok)">48 h bouclées</text>`;
  return`<svg class="ring" viewBox="0 0 320 320" role="group" aria-label="Les 12 manches sur 48 heures">${segs}${center}</svg>`;
}

  const ev=[];
  S.data.taches.filter(x=>x.statut!=="fait"&&x.echeance).forEach(x=>ev.push({d:x.echeance,t:x.titre,k:"Tâche",col:"taches",id:x.id}));
  S.data.demarches.filter(x=>x.statut!=="valide"&&x.echeance).forEach(x=>ev.push({d:x.echeance,t:x.titre,k:"Démarche",col:"demarches",id:x.id}));
  S.data.sponsors.filter(x=>x.relance&&!["confirme","remercie","refus"].includes(x.statut)).forEach(x=>ev.push({d:x.relance,t:"Relance "+x.nom,k:"Sponsor",col:"sponsors",id:x.id}));

  return`<ul class="list">${ev.slice(0,8).map(e=>`<li><button class="item" data-edit="${e.col}" data-id="${e.id}"><span class="grow"><span class="t">${esc(e.t)}</span><br><span class="m">${e.k}, ${fmtDate(e.d)}</span></span><span class="pill ${daysTo(e.d)<0?"danger":daysTo(e.d)<=7?"warn":""}">${daysTo(e.d)<0?"en retard":"J−"+daysTo(e.d)}</span></button></li>`).join("")}</ul>`;
}

VIEWS.budget=()=>{

const FT={"application/vnd.google-apps.document":"DOC","application/vnd.google-apps.spreadsheet":"TAB","application/vnd.google-apps.presentation":"PRES","application/vnd.google-apps.form":"FORM","application/pdf":"PDF","application/vnd.openxmlformats-officedocument.wordprocessingml.document":"WORD","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"XLS","application/vnd.openxmlformats-officedocument.presentationml.presentation":"PPT","text/html":"HTML","application/zip":"ZIP","text/csv":"CSV"};
function ftype(f){if(f.folder)return"DOS";if(FT[f.mime])return FT[f.mime];if((f.mime||"").startsWith("image/"))return"IMG";if((f.mime||"").startsWith("video/"))return"VID";const m=/\.([a-z0-9]{2,4})$/i.exec(f.title||"");return m?m[1].toUpperCase():"FIC"}
const isFolder=f=>f.mimeType==="application/vnd.google-apps.folder";
function driveErr(e){
  const c=e&&e.code;
  if(c==="needs_reauth")return"Google Drive demande une reconnexion. Reconnecte-le dans les connecteurs de ton compte Claude, puis relance.";
  if(c==="server_not_connected")return"Le connecteur Google Drive n'est pas ajouté à ce compte Claude.";
  if(c==="blocked_by_policy")return"Ton organisation bloque l'accès à Google Drive depuis cette page.";
  if(c==="approval_required"||c==="cancelled")return"L'accès à Google Drive n'a pas été autorisé pour cette page.";
  if(c==="tool_error")return"Google Drive a refusé la recherche : "+(e.message||"");
  if(c==="server_unavailable")return"Google Drive ne répond pas pour le moment. Réessaie dans une minute.";
  return"Accès à Google Drive impossible ("+(c||"erreur")+").";
}
async function driveSearch(query,pageToken,retried){
  const input={query,pageSize:100,excludeContentSnippets:true};if(pageToken)input.pageToken=pageToken;
  try{const r=await S.mcp.callTool("Google Drive","search_files",input);let p=r.payload;
    if(p===undefined){try{p=JSON.parse((r.content||[]).find(b=>b.type==="text").text)}catch(_){p={}}}return p||{}}
  catch(e){if(e&&e.retryable&&!retried){await new Promise(z=>setTimeout(z,(e.retryAfterMs||1500)+Math.random()*800));return driveSearch(query,pageToken,true)}throw e}
}
const DRV={msg:"",busy:false,found:null};
async function findRoots(q){

async function scanDrive(){
  const root=S.cfg.drive.rootId;if(!root||DRV.busy)return;
  DRV.busy=true;DRV.msg="Scan en cours…";render();
  const nodes={[root]:{id:root,title:S.cfg.drive.rootTitle||"Racine",folder:true,parent:null,kids:[]}};
  const queue=[{id:root,depth:0}];let n=0;const MAX=600;
  try{
    while(queue.length&&n<MAX){
      const{id,depth}=queue.shift();let tok=null,pages=0;
      do{const p=await driveSearch(`parentId = '${id}'`,tok);
        (p.files||[]).forEach(f=>{if(nodes[f.id])return;n++;nodes[f.id]={id:f.id,title:f.title,mime:f.mimeType,folder:isFolder(f),size:+f.fileSize||0,modified:f.modifiedTime,created:f.createdTime,owner:f.owner,url:f.viewUrl,parent:id,kids:[]};nodes[id].kids.push(f.id);if(isFolder(f)&&depth<6)queue.push({id:f.id,depth:depth+1})});
        tok=p.nextPageToken;pages++;DRV.msg=`Scan en cours… ${n} éléments lus`;render();
      }while(tok&&pages<5&&n<MAX);
    }
    S.drive={root,at:new Date().toISOString(),nodes,partial:n>=MAX};LS.set("drive",S.drive);DRV.msg=n>=MAX?`Scan arrêté à ${MAX} éléments : choisis un dossier racine plus précis pour tout couvrir.`:"";
  }catch(e){DRV.msg=driveErr(e)}
  DRV.busy=false;render();
}
const baseName=t=>norm(t).replace(/\.[a-z0-9]{2,5}$/,"").replace(/\b(copie de|copy of)\b/g,"").replace(/\(\d+\)/g,"").replace(/[_\-]+/g," ").replace(/\b(v|version)\s?\d+\b/g,"").replace(/\b(final|finale|def|definitif|definitive|ok|vf)\b/g,"").replace(/\s+/g," ").trim();
function subtree(id){const N=S.drive.nodes,out=[];const walk=i=>{(N[i]&&N[i].kids||[]).forEach(k=>{out.push(N[k]);if(N[k].folder)walk(k)})};walk(id);return out}
function analyse(id){
  const all=subtree(id),files=all.filter(f=>!f.folder),folders=all.filter(f=>f.folder);
  const groups={};files.forEach(f=>{const b=baseName(f.title);if(b.length<3)return;(groups[b]=groups[b]||[]).push(f)});
  const doublons=Object.values(groups).filter(g=>g.length>1).map(g=>g.sort((a,b)=>String(b.modified).localeCompare(a.modified)));
  const vieux=files.filter(f=>f.modified&&(Date.now()-new Date(f.modified))/864e5>180);
  const vides=folders.filter(f=>!f.kids.length);
  const last=all.reduce((m,f)=>f.modified>m?f.modified:m,"");
  return{files,folders,doublons,vieux,vides,last};
}

async function csv(col){const f=SCHEMA[col].fields.filter(x=>x.t!=="check"||true);
  const rows=[f.map(x=>x.l)].concat(S.data[col].map(r=>f.map(x=>x.t==="select"?lab(x.o,r[x.k]):r[x.k]??"")));
  const txt="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  if(await saveFile(`saintes448-${col}-${todayISO()}.csv`,txt,"text/csv;charset=utf-8"))toast("Export prêt");
}

/* ---------- interactions ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-go],[data-new],[data-edit],[data-close],[data-del],[data-filter],[data-viewmode],[data-move],[data-lap],[data-csv],[data-scale],[data-theme],[data-backup],[data-ask],[data-propose],[data-addprop],[data-scan],[data-root],[data-goto],[data-fiche],[data-autofiche],[data-linktask],[data-resetcheck],[data-quick],[data-restore],[data-savekey]");
  if(!t)return;const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.new)return openForm(d.new,null,d.new==="incidents"?{heure:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),manche:phase().pendant?phase().n:""}:null);
  if(d.edit)return openForm(d.edit,d.id);
  if(d.close)return closeSheet();
  if(d.del){if(!confirm("Supprimer définitivement cet élément ?"))return;const{col,id}=FORM;closeSheet();await remove(col,id);return toast("Supprimé")}
  if(d.filter!==undefined&&d.filter){S.filter[d.filter]=d.v;return render()}
  if(d.viewmode){S.view.taches=d.viewmode;LS.set("view",S.view);return render()}
  if(d.move){return save("taches",d.move,{statut:d.to})}
  if(d.lap){const p=S.data.pagayeurs.find(x=>x.id===d.lap);if(!p)return;const n=+d.n;let m=(p.manches||[]).slice();m=m.includes(n)?m.filter(x=>x!==n):m.concat(n).sort((a,b)=>a-b);const upd={manches:m};if(m.length===12)upd.statut="finisher";else if(p.statut==="inscrit")upd.statut="en_course";return save("pagayeurs",p.id,upd,{silent:true})}
  if(d.csv)return csv(d.csv);
  if(d.scale){let s=LS.get("scale",1);s=Math.min(1.4,Math.max(.85,Math.round((s+(+d.scale)*.1)*100)/100));LS.set("scale",s);document.documentElement.style.setProperty("--scale",s);return render()}
  if(d.theme){if(d.theme==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=d.theme;LS.set("theme",d.theme);return render()}
  if(d.backup){if(await saveFile(`saintes448-sauvegarde-${todayISO()}.json`,JSON.stringify({app:"qg448",exporte:new Date().toISOString(),config:S.cfg,data:S.data,journal:S.journal},null,1),"application/json")){LS.set("lastBackup",new Date().toISOString());toast("Sauvegarde téléchargée");render()}return}
  if(d.restore){$("#restorefile").click();return}
  if(d.savekey){const k=$("#apikey").value.trim(),m=$("#apimodel").value.trim();LS.set("apikey",k);LS.set("apimodel",m||DEFAULT_MODEL);setupAI();toast(k?"Clé enregistrée sur ce téléphone":"Clé effacée");return render()}
  if(d.ask)return ask(d.ask);
  if(d.propose)return propose();
  if(d.addprop){const m=S.chat[+d.addprop],p=m.prop[+d.i];await save("taches",null,{titre:p.titre,pole:p.pole||"",echeance:/^\d{4}-\d\d-\d\d$/.test(p.echeance||"")?p.echeance:"",urgence:["basse","normale","haute"].includes(p.urgence)?p.urgence:"normale",statut:"a_faire",notes:p.pourquoi||""});p.ajoutee=true;return render()}
  if(d.scan)return scanDrive();
  if(d.root){await saveCfg("drive",{rootId:d.root,rootTitle:d.title});DRV.found=null;go("dossiers");return scanDrive()}
  if(d.goto)return go("dossiers/"+d.goto);
  if(d.fiche)return openForm("fiches",d.fiche);
  if(d.autofiche)return autoFiche(d.autofiche);
  if(d.linktask){const n=S.drive.nodes[d.linktask];return openForm("taches",null,{dossier:n.title,dossierId:n.id})}
  if(d.resetcheck){if(!confirm("Décocher tous les points de cette phase pour la prochaine manche ?"))return;for(const c of S.data.checklist.filter(c=>c.phase===d.resetcheck&&c.fait))await save("checklist",c.id,{fait:false,faitLe:"",faitPar:""},{silent:true});return toast("Phase remise à zéro")}
  if(d.quick){closeSheet();return openForm(d.quick,null,d.quick==="incidents"?{heure:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),manche:phase().pendant?phase().n:""}:null)}
});
document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest(".seg");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openForm("manches",g.dataset.id)}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.q){S.q[t.dataset.q]=t.value;render()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="restorefile"&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j.data)throw 0;if(!confirm("Remplacer toutes les données de ce téléphone par celles de la sauvegarde ?"))return;COLS.forEach(c=>S.data[c]=Array.isArray(j.data[c])?j.data[c]:[]);S.cfg=j.config||S.cfg;S.journal=j.journal||S.journal;LS.set("local",{data:S.data,cfg:S.cfg});cacheAll();toast("Sauvegarde restaurée");render()}catch(_){toast("Ce fichier n'est pas une sauvegarde QG 4/4/48.")}t.value="";return}
if(t.dataset&&t.dataset.check){save("checklist",t.dataset.check,t.checked?{fait:true,faitLe:new Date().toISOString(),faitPar:S.uid||""}:{fait:false,faitLe:"",faitPar:""},{silent:true})}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="itemform")return submitForm(f);
  if(f.id==="askform"){const q=$("#askq").value;$("#askq").value="";return ask(q)}
  if(f.id==="rootform"){const q=$("#rootq").value.trim();if(q)findRoots(q);return}
  if(f.id==="cfgform"){const el=f.elements;saveCfg("event",{debut:el.debut.value||"2028-06-03T12:00",heureConfirmee:el.heureConfirmee.checked,benevolesCible:+el.benevolesCible.value||70,polesPrevus:+el.polesPrevus.value||11});toast("Réglages enregistrés")}
});
$("#sheet").addEventListener("close",()=>{FORM=null});
$("#fab").addEventListener("click",()=>{
  $("#sheetin").innerHTML=`<header><h2>Action rapide</h2><button type="button" class="iconbtn" data-close="1" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="body"><div class="quick"><button class="btn" data-quick="incidents" style="border-color:var(--danger);color:var(--danger)">Signaler un incident</button><button class="btn" data-quick="taches">Nouvelle tâche</button><button class="btn" data-quick="budget">Dépense ou recette</button><button class="btn" data-quick="sponsors">Nouveau sponsor</button><button class="btn" data-quick="benevoles">Nouveau bénévole</button><button class="btn" data-quick="decisions">Noter une décision</button></div></div>`;
  $("#sheet").showModal();
});

/* ---------- démarrage ---------- */
(function init(){
  const th=LS.get("theme","auto");if(th!=="auto")document.documentElement.dataset.theme=th;
  document.documentElement.style.setProperty("--scale",LS.get("scale",1));
  setTimeout(()=>LS.set("seen",new Date().toISOString()),8000);
  route();connect();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  setInterval(()=>{if(S.route==="accueil"&&!$("#sheet").open)render()},60000);
})();
</script>
</body>
